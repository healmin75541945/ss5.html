<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Center Align Text</title>
    <link rel="stylesheet" href="ex6.css">
</head>
<body>
    <h1>Center Align Text</h1>
    
    <p>To just center the text inside an element, use <code>text-align: center;</code></p>

    <div class="center-box">
        This text is centered.
    </div>

    <h2>Example</h2>

    <div class="code-box">
        <p><span class="selector">.center</span> {</p>
        <p class="property">text-align: <span class="value">center</span>;</p>
        <p class="property">border: <span class="value">3px solid green</span>;</p>
        <p>}</p>
    </div>

    <button>Try it Yourself »</button>
</body>
</html>
