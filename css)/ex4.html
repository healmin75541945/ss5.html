<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn Âm Hồn</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            display: flex;
            max-width: 800px;
            margin: 20px auto;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
        .image {
            flex: 1;
        }
        .image img {
            width: 100%;
            border-radius: 8px;
        }
        .content {
            flex: 2;
            padding-left: 15px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
        }
        .meta {
            color: gray;
            font-size: 14px;
        }
        .description {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGRXSf3Gw4HX--GjKTdxcJ-aYg2xA8v2aFeQ&s" alt="Đèn Âm Hồn">
        </div>
        <div class="content">
            <div class="title">Đèn Âm Hồn: Phim tôn vinh văn hóa Việt lại đi đạo nhái loạt bom tấn nước ngoài</div>
            <div class="meta">Cine - 20 giờ trước</div>
            <div class="description">Tác phẩm của đạo diễn Hoàng Nam "học lỏm" nhiều phim kinh dị nổi tiếng nhưng chất lượng kém xa.</div>
        </div>
    </div>
</body>
</html>
